<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#0B0A0A;--ink:#F6EFEA;--dim:#A79C98;--line:#2C2422;
 --red:#C11812;--red-2:#E85A56;--gold:#C8A14C;--paper:#F5E9E2;--ok:#6FD3A2;
 --ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-size:18px;line-height:1.65;
 font-family:'Tajawal','Geeza Pro','SF Arabic',system-ui,-apple-system,sans-serif;
 -webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
header{position:fixed;inset-block-start:0;inset-inline:0;z-index:60;display:flex;
 align-items:center;gap:14px;padding:14px min(4vw,32px);
 background:linear-gradient(to bottom,rgba(11,10,10,.94),rgba(11,10,10,0));pointer-events:none}
header>*{pointer-events:auto}
header img{height:30px;background:#fff;padding:6px 10px;border-radius:9px}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:rgba(20,17,17,.75);color:var(--ink);
 border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;font-size:14.5px;
 cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--red-2);color:var(--red-2)}
.rail{position:fixed;inset-block:0;inset-inline-end:14px;z-index:55;display:flex;
 flex-direction:column;gap:9px;align-items:center;justify-content:center;pointer-events:none}
.rail b{width:8px;height:8px;border-radius:50%;background:#3A302E;transition:all .3s var(--ease);
 pointer-events:auto;cursor:pointer}
.rail b.on{background:var(--red-2);height:26px;border-radius:5px}
.hero{min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;
 text-align:center;padding:90px 20px 40px}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;
 opacity:.2;filter:grayscale(.35) contrast(1.05)}
.hero .veil{position:absolute;inset:0;
 background:radial-gradient(110% 80% at 50% 40%,rgba(11,10,10,.25),rgba(11,10,10,.96) 72%)}
.hero .in{position:relative;max-width:900px}
.hero .kick{color:var(--gold);font-weight:800;letter-spacing:.26em;font-size:13px}
.hero h1{font-size:clamp(44px,9vw,104px);font-weight:900;line-height:1.02;margin-top:14px;
 letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--red-2)}
.hero p{color:var(--dim);font-size:clamp(17px,2.3vw,22px);margin-top:20px;max-width:40ch;
 margin-inline:auto}
.stats{display:flex;gap:clamp(18px,4vw,52px);justify-content:center;flex-wrap:wrap;margin-top:44px}
.stats div{text-align:center}
.stats b{display:block;font-size:clamp(28px,5vw,44px);font-weight:900;color:var(--paper);
 font-variant-numeric:tabular-nums;line-height:1}
.stats span{display:block;color:var(--dim);font-size:14px;margin-top:6px}
.scrollhint{position:absolute;inset-block-end:26px;inset-inline:0;color:var(--dim);
 font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:7px}
.scrollhint i{width:1px;height:34px;background:linear-gradient(var(--dim),transparent);
 animation:drop 2s var(--ease) infinite}
@keyframes drop{0%{opacity:0;transform:translateY(-10px)}40%{opacity:1}
 100%{opacity:0;transform:translateY(12px)}}
.opener{min-height:100svh;display:grid;place-items:center;padding:110px 20px 70px}
.opener .in{width:min(860px,92vw)}
.opener .idx{color:var(--red-2);font-weight:900;letter-spacing:.24em;font-size:13px}
.opener h2{font-size:clamp(34px,6.4vw,68px);font-weight:900;line-height:1.06;margin-top:12px;
 letter-spacing:-.02em}
.juice{margin-top:26px;border-inline-start:4px solid var(--red);padding-inline-start:20px}
.juice b{display:block;font-size:clamp(24px,4.4vw,42px);font-weight:900;color:var(--paper);
 line-height:1.15}
.juice span{display:block;color:var(--dim);font-size:clamp(16px,2.2vw,19px);margin-top:8px}
.opener .lede{color:var(--dim);font-size:clamp(16px,2.1vw,19px);margin-top:26px;max-width:54ch}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 13px;
 font-size:13.5px;font-weight:800;background:rgba(111,211,162,.13);color:var(--ok);margin-top:22px}
.pill.you{background:rgba(200,161,76,.15);color:var(--gold)}
.track{position:relative}
.stage{position:sticky;inset-block-start:0;height:100svh;overflow:hidden}
.frame{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.shotbox{position:relative;width:min(1120px,88vw);aspect-ratio:16/10;
 transform-origin:50% 50%;will-change:transform}
.shotbox .lay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
 opacity:0;transition:opacity .45s var(--ease);border-radius:12px}
.shotbox .lay.on{opacity:1}
.mk{position:absolute;width:34px;height:34px;border-radius:50%;background:var(--red);
 color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;border:2.5px solid #fff;
 box-shadow:0 4px 18px rgba(0,0,0,.6);transform:translate(-50%,-50%) scale(var(--inv,1));
 opacity:0;transition:opacity .35s var(--ease)}
.mk.on{opacity:1}
.mk::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--red);
 opacity:.55;animation:ping 1.9s ease-out infinite}
@keyframes ping{0%{transform:scale(.75);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.caption{position:absolute;inset-block-end:clamp(18px,4vh,44px);inset-inline-start:50%;
 transform:translateX(50%);width:min(700px,90vw);z-index:5;background:rgba(14,12,12,.9);
 border:1px solid var(--line);border-radius:16px;padding:18px 22px}
body[dir=ltr] .caption{transform:translateX(-50%)}
.caption .n{display:inline-flex;align-items:center;justify-content:center;width:27px;height:27px;
 border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:13.5px;
 margin-inline-end:10px;vertical-align:2px}
.caption h4{display:inline;font-size:clamp(18px,2.4vw,23px);font-weight:800}
.caption p{color:var(--dim);font-size:clamp(14.5px,1.9vw,16.5px);margin-top:8px;line-height:1.6}
footer{border-block-start:1px solid var(--line);padding:60px 20px 70px;text-align:center;
 color:var(--dim);font-size:15px}
footer b{color:var(--paper)}
@media (prefers-reduced-motion:reduce){.mk::after,.scrollhint i{animation:none}html{scroll-behavior:auto}}
@media(max-width:760px){.shotbox{width:95vw}.caption{inset-block-end:14px;padding:14px 16px}.rail{display:none}}
</style>
</head>

 <img src="assets/brand/logo.png" alt="Medmac Kuwait">

ne button switches while keeping your place."}, {"img": "assets/shots/site/services.png", "s": 1.0, "ox": 50, "oy": 34, "t": "الأقسام", "d": "كل قسم من أقسام الشركة له بطاقته وصفحته — الزائر يصل لقسمه في نقرة.", "tEn": "The divisions", "dEn": "Every division has its card and its page — a visitor reaches their field in one click."}, {"img": "assets/shots/site/projects.png", "s": 1.0, "ox": 50, "oy": 34, "t": "المشاريع", "d": "أعمال منفّذة بصورها وأسماء مواقعها — الدليل الذي يطلبه العميل قبل أن يسأل عن السعر.", "tEn": "Projects", "dEn": "Executed work with photographs and site names — the proof a client wants before asking the price."}, {"img": "assets/shots/site/factory.png", "s": 1.0, "ox": 50, "oy": 34, "t": "المصنع", "d": "خط الإنتاج والقدرة التصنيعية — ما يفرّقنا عن المقاول الذي يشتري جاهزاً.", "tEn": "The factory", "dEn": "The production line and the manufacturing capacity — what separates us from a contractor who buys ready-made."}, {"img": "assets/shots/site/fleet.png", "s": 1.0, "ox": 50, "oy": 34, "t": "الأسطول", "d": "المعدات المملوكة للشركة بأرقامها — تُقرأ كضمان تنفيذ لا كديكور.", "tEn": "The fleet", "dEn": "The equipment the company owns, with its numbers — read as a guarantee of delivery, not as decoration."}, {"img": "assets/shots/site/misting.png", "s": 1.0, "ox": 50, "oy": 34, "t": "الرذاذ والتبريد", "d": "الخط الذي دخل حديثاً، له صفحته الكاملة من أول يوم.", "tEn": "Misting and cooling", "dEn": "The line that entered recently has its full page from day one."}, {"img": "assets/shots/site/contact.png", "s": 1.0, "ox": 50, "oy": 34, "t": "تواصل معنا", "d": "نموذج يصل للبريد مباشرة، ورقم وموقع على الخريطة — لا صفحة مكتوب فيها «قريباً».", "tEn": "Contact us", "dEn": "A form that reaches the inbox directly, a number and a map location — no page that says “coming soon”."}]], "arEn": "The Website", "hEn": "The new site is published and working — it waits only on your decision.", "juiceEn": "96 out of 100", "juiceSubEn": "Google's own mobile speed score for t due births", "dEn": "The alert names the ewe and how many days she is overdue, with a “record the birth” button beside it — the decision is made from the same line."}, {"img": "assets/shots/farm/animal.png", "s": 1.0, "ox": 50, "oy": 38, "t": "تسجيل الحدث — بطاقة النعجة", "d": "الولادة أو النقل للمرحلة التالية يُسجَّل من بطاقتها، فيضبط الموعد القادم نفسه.", "tEn": "Recording it — the ewe card", "dEn": "A birth or a move to the next stage is recorded from her card, and the next date sets itself."}, {"img": "assets/shots/farm/whatsapp.png", "s": 1.0, "ox": 50, "oy": 40, "t": "العامل في الحظيرة", "d": "يكتب رسالة عادية بلغته، والنظام يقرأها ويعرض ما فهمه قبل الحفظ — لا يحتاج أن يفتح البرنامج.", "tEn": "The worker in the pen", "dEn": "He writes an ordinary message in his own words, and the system shows what it understood before saving — he never has to open the program."}, {"img": "assets/shots/farm/costs.png", "s": 1.0, "ox": 50, "oy": 38, "t": "آخر الشهر", "d": "٦٧٣ د.ك تكاليف مقابل ٤٠٥ د.ك إيرادات — الربح يظهر أثناء الموسم فيمكن تعديل المسار.", "tEn": "Month end", "dEn": "KD 673 in costs against KD 405 in revenue — profit shows during the season, so the course can still be corrected."}]], "arEn": "A Day in the Farm System", "hEn": "Twelve everyday situations, and the screen each one opens.", "juiceEn": "12 use cases", "juiceSubEn": "Not a tour of the software — the actual moments of a working day, in order.", "ledeEn": "Morning, a decision to make, a specific ewe, a birth, the daily feed, the worker in the pen, a mistaken entry, the week's end, the month's end, and planning the season."}, {"id": "visual", "ar": "التصميم والتوثيق", "h": "الشغل الذي ليس برنامجاً.", "juice": "٢٣٦ مقطعاً · ٣٠٧ صورة", "juiceSub": "توثيق ميداني لتركيب رافعة على ست مراحل، وصور مشاريع، وتصاميم ومنشورات.", "lede": "هذه المادة هي المصدر البصري لكل ملف تعريفي وكل إعلان في هذه الصفحة — لا صور مشتراة ولا صور كتالوجات أجنبية.", "status": "ready", "stages": [[{"img": "assets/shots/crane-stages.png" line, used as they are at exhibitions and in print."}]], "arEn": "Design & Visual Work", "hEn": "The work that is not software.", "juiceEn": "236 field clips", "juiceSubEn": "Twenty-four gigabytes documenting a crane installation across six numbered stages — real execution, not catalogue photography.", "ledeEn": "The designs, the social posts, the product banners, the project photographs, and the field documentation on video."}];
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const film = document.getElementById("film");

function stageHTML(beats, key){
  const imgs = [...new Set(beats.map(b=>b.img))];
  return `<div class="track" data-k="${key}" style="height:${Math.max(2,beats.length)*88}svh">
    <div class="stage"><div class="frame">
      <div class="shotbox">
        ${imgs.map(src=>`<img class="lay" data-src="${esc(src)}" src="${esc(src)}" alt="" loading="lazy">`).join("")}
        ${beats.map((b,i)=> b.mx==null?"":
          `<span class="mk" data-i="${i}" style="left:${b.mx}%;top:${b.my}%">${i+1}</span>`).join("")}
      </div>
      <div class="caption"><span class="n">1</span><h4></h4><p></p></div>
    </div></div></div>`;
}

// ?lang=en makes an English link shareable; otherwise the last choice is remembered.
let L = (new URLSearchParams(location.search).get("lang")
         || localStorage.getItem("medmac-lang")) === "en" ? "en" : "ar";
const T = {
  ar:{start:"ابدأ", ready:"جاهز الآن", you:"ينتظر قرارك", other:"English",
      kick:"شركة مدماك الكويت للتجارة العامة والمقاولات",
      h1:'شغل <em>مدماك</em>.<br>وش يوفّر لك بالضبط.',
      sub:"كل فصل يبدأ بالفائدة، وبعدين الكاميرا تنزل على الشاشة وتوريك كل ميزة بمكانها.",
      hint:"انزل",
      stats:[["٤٬٧٢٩","عرض سعر في الأرشيف"],["٤٢","شاشة برنامج مشروحة"],
             ["٨","ملفات تعريفية"],["٥","برامج تشتغل الآن"]]},
  en:{start:"Start", ready:"Ready now", you:"Waiting on you", other:"عربي",
      kick:"Medmac Kuwait Co. for General Trading & Contracting",
      h1:'The <em>Medmac</em> work.<br>What it actually saves you.',
      sub:"Every chapter opens with the payoff, then the camera moves across the screen and shows you each feature where it lives.",
      hint:"Scroll",
      stats:[["4,729","quotations archived"],["42","program screens explained"],
             ["8","company profiles"],["5","programs running now"]]}
};
const pick = (o,k) => (L==="en" && o[k+"En"]) ? o[k+"En"] : o[k];

const lerp=(a,b,t)=>a+(b-a)*t, easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let tracks = [];
function render(){
let html = "";
CH.forEach((c,ci)=>{
  html += `<section class="chapter" id="ch-${c.id}">
    <div class="opener"><div class="in">
      <div class="idx">${String(ci+1).padStart(2,"0")} — ${esc(pick(c,"ar"))}</div>
      <h2>${esc(pick(c,"h"))}</h2>
      <div class="juice"><b>${esc(pick(c,"juice"))}</b><span>${esc(pick(c,"juiceSub"))}</span></div>
      <p class="lede">${esc(pick(c,"lede"))}</p>
      <span class="pill${c.status==="you"?" you":""}">${c.status==="you"?T[L].you:T[L].ready}</span>
    </div></div>`;
  c.stages.forEach((st,si)=> html += stageHTML(st, ci+"."+si));
  html += `</section>`;
});
film.innerHTML = html;
document.getElementById("rail").innerHTML =
  CH.map(c=>`<b data-go="ch-${c.id}" title="${esc(pick(c,"ar"))}"></b>`).join("");
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>
  document.getElementById(b.dataset.go).scrollIntoView({behavior:"smooth"}));

tracks=[...document.querySelectorAll(".track")].map(el=>{
  const [ci,si]=el.dataset.k.split(".").map(Number);
  return {el, beats:CH[ci].stages[si], box:el.querySelector(".shotbox"),
    lays:[...el.querySelectorAll(".lay")],
    capN:el.querySelector(".caption .n"), capH:el.querySelector(".caption h4"),
    capP:el.querySelector(".caption p"), marks:[...el.querySelectorAll(".mk")], last:-1};
});

// The shell text lives outside the chapters, so it is swapped here rather than re-rendered.
document.documentElement.lang = L;
document.documentElement.dir  = (L==="en") ? "ltr" : "rtl";
document.body.dir             = document.documentElement.dir;
document.getElementById("lang").textContent  = T[L].other;
document.getElementById("startbtn").textContent = T[L].start;
const heroKick = document.querySelector(".hero .kick"),
      heroH1   = document.querySelector(".hero h1"),
      heroP    = document.querySelector(".hero .in > p");
if (heroKick) heroKick.textContent = T[L].kick;
if (heroH1)   heroH1.innerHTML     = T[L].h1;
if (heroP)    heroP.textContent    = T[L].sub;
const statsEl = document.getElementById("stats");
if (statsEl) statsEl.innerHTML =
  T[L].stats.map(([n,w])=>`<div><b>${esc(n)}</b><span>${esc(w)}</span></div>`).join("");
const hintEl = document.querySelector(".scrollhint span");
if (hintEl) hintEl.textContent = T[L].hint;
}

render();
document.getElementById("lang").addEventListener("click", () => {
  // Keep the reader where they were: the page is one long scroll, so remember the
  // fraction rather than the pixel — the two languages do not wrap to the same height.
  const frac = scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight);
  L = (L==="en") ? "ar" : "en";
  localStorage.setItem("medmac-lang", L);
  render();
  scrollTo(0, frac * (document.documentElement.scrollHeight - innerHeight));
  tick();
});

let raf=0;
function tick(){
  const vh=innerHeight;
  for(const t of tracks){
    const r=t.el.getBoundingClientRect();
    if(r.bottom<-vh||r.top>vh*1.5) continue;
    const span=Math.max(1,r.height-vh);
    const p=Math.min(1,Math.max(0,-r.top/span));
    const n=t.beats.length-1, seg=p*n;
    let i=n===0?0:Math.min(n-1,Math.floor(seg));
    const f=n===0?0:easeIO(Math.min(1,seg-i));
    const A=t.beats[i], B=t.beats[Math.min(n,i+1)]||A;
    const same=A.img===B.img;
    const s=same?lerp(A.s,B.s,f):(f<.5?A.s:B.s);
    const ox=same?lerp(A.ox,B.ox,f):(f<.5?A.ox:B.ox);
    const oy=same?lerp(A.oy,B.oy,f):(f<.5?A.oy:B.oy);
    t.box.style.transformOrigin=ox+"% "+oy+"%";
    t.box.style.transform="scale("+s.toFixed(4)+")";
    t.box.style.setProperty("--inv",(1/s).toFixed(4));
    const active=f>.5?Math.min(n,i+1):i;
    if(active!==t.last){
      t.last=active;
      const b=t.beats[active];
      t.capN.textContent=active+1;
      t.capH.textContent=pick(b,"t");
      t.capP.textContent=pick(b,"d");
      t.lays.forEach(l=>l.classList.toggle("on", l.dataset.src===b.img));
      t.marks.forEach(m=>m.classList.toggle("on", +m.dataset.i===active));
    }
  }
  const mid=scrollY+vh/2;
  CH.forEach((c,i)=>{
    const el=document.getElementById("ch-"+c.id); if(!el) return;
    const dot=document.querySelectorAll("#rail b")[i];
    if(dot) dot.classList.toggle("on", mid>=el.offsetTop && mid<el.offsetTop+el.offsetHeight);
  });
  raf=0;
}
const onScroll=()=>{ if(!raf) raf=requestAnimationFrame(tick); };
addEventListener("scroll",onScroll,{passive:true});
addEventListener("resize",onScroll,{passive:true});
addEventListener("load",onScroll);
tick();

(function(){
  const q=new URLSearchParams(location.search).get("y");
  if(q===null) return;
  // The page grows as images and fonts settle, so a single scroll lands short and
  // gets clamped. Keep re-applying until the target actually sticks.
  const target=+q;
  const go=()=>{scrollTo(0,target);tick();};
  go();
  addEventListener("load",go);
  let n=0;
  const id=setInterval(()=>{
    go();
    if(Math.abs(scrollY-target)<2 && ++n>6) clearInterval(id);
    if(n>75) clearInterval(id);
    n++;
  },80);
})();
</script>
</body>
</html>
