<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شغل مدماك — Medmac Work</title>
<meta name="description" content="كل ما بُني لشركة مدماك الكويت — ما الذي يوفّره، وكيف يعمل، خطوة بخطوة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0A0A; --ink:#F6EFEA; --dim:#A79C98; --line:#2C2422;
  --red:#C11812; --red-2:#E85A56; --gold:#C8A14C; --paper:#F5E9E2;
  --ok:#6FD3A2;
  --stage-h:100svh;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Tajawal','Geeza Pro','SF Arabic',system-ui,-apple-system,sans-serif;
  font-size:18px;line-height:1.65;-webkit-font-smoothing:antialiased;
}
body[dir=ltr]{font-family:'Tajawal',system-ui,-apple-system,sans-serif}
img{display:block;max-width:100%}
.wrap{width:min(1180px,92vw);margin-inline:auto}

/* ── top bar ── */
header{
  position:fixed;inset-block-start:0;inset-inline:0;z-index:60;
  display:flex;align-items:center;gap:14px;padding:14px min(4vw,32px);
  background:linear-gradient(to bottom,rgba(11,10,10,.92),rgba(11,10,10,0));
  pointer-events:none;
}
header>*{pointer-events:auto}
header img{height:30px;background:#fff;padding:6px 10px;border-radius:9px}
header .sp{flex:1}
.btn{
  border:1px solid var(--line);background:rgba(20,17,17,.7);color:var(--ink);
  border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;font-size:14.5px;
  cursor:pointer;backdrop-filter:blur(8px);text-decoration:none;white-space:nowrap;
}
.btn:hover{border-color:var(--red-2);color:var(--red-2)}

/* ── progress rail ── */
.rail{position:fixed;inset-block:0;inset-inline-end:14px;z-index:55;
  display:flex;flex-direction:column;gap:9px;align-items:center;justify-content:center;
  pointer-events:none}
.rail b{width:8px;height:8px;border-radius:50%;background:#3A302E;transition:all .3s var(--ease);
  pointer-events:auto;cursor:pointer}
.rail b.on{background:var(--red-2);height:26px;border-radius:5px}

/* ── hero ── */
.hero{min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;
  text-align:center;padding:90px 20px 40px}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;
  opacity:.20;filter:grayscale(.35) contrast(1.05)}
.hero .veil{position:absolute;inset:0;
  background:radial-gradient(110% 80% at 50% 40%,rgba(11,10,10,.25),rgba(11,10,10,.96) 72%)}
.hero .in{position:relative;max-width:900px}
.hero .kick{color:var(--gold);font-weight:800;letter-spacing:.26em;font-size:13px;
  text-transform:uppercase}
.hero h1{font-size:clamp(44px,9vw,104px);font-weight:900;line-height:1.02;margin-top:14px;
  letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--red-2)}
.hero p{color:var(--dim);font-size:clamp(17px,2.3vw,22px);margin-top:20px;
  max-width:38ch;margin-inline:auto}
.stats{display:flex;gap:clamp(18px,4vw,52px);justify-content:center;flex-wrap:wrap;margin-top:44px}
.stats div{text-align:center}
.stats b{display:block;font-size:clamp(28px,5vw,44px);font-weight:900;color:var(--paper);
  font-variant-numeric:tabular-nums;line-height:1}
.stats span{display:block;color:var(--dim);font-size:14px;margin-top:6px}
.scrollhint{position:absolute;inset-block-end:26px;inset-inline:0;color:var(--dim);font-size:13.5px;
  display:flex;flex-direction:column;align-items:center;gap:7px}
.scrollhint i{width:1px;height:34px;background:linear-gradient(var(--dim),transparent);
  animation:drop 2s var(--ease) infinite}
@keyframes drop{0%{opacity:0;transform:translateY(-10px)}40%{opacity:1}100%{opacity:0;transform:translateY(12px)}}

/* ── chapter ── */
.chapter{position:relative}
.track{position:relative}
.stage{
  position:sticky;inset-block-start:0;height:var(--stage-h);overflow:hidden;
  display:grid;grid-template-columns:1fr;align-items:center;
}
.frame{
  position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;
}
.shotbox{
  position:relative;width:min(1100px,86vw);aspect-ratio:var(--ar,16/10);
  border-radius:14px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 40px 120px rgba(0,0,0,.7);background:#111;
  transform-origin:50% 50%;will-change:transform;
}
.shotbox>img{width:100%;height:100%;object-fit:cover;object-position:top center}
.redact{
  position:absolute;border-radius:6px;
  background:rgba(20,17,17,.62);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  border:1px solid rgba(232,90,86,.5);
  display:grid;place-items:center;overflow:hidden;
}
.redact span{
  color:#E8B65C;font-weight:800;white-space:nowrap;
  font-size:calc(11px * var(--inv,1));opacity:.95;
}
.mk{
  position:absolute;width:34px;height:34px;border-radius:50%;
  background:var(--red);color:#fff;display:grid;place-items:center;
  font-weight:900;font-size:15px;border:2.5px solid #fff;
  box-shadow:0 4px 18px rgba(0,0,0,.6);
  transform:translate(-50%,-50%) scale(var(--inv,1));
  opacity:0;transition:opacity .35s var(--ease);
}
.mk.on{opacity:1}
.mk::after{
  content:"";position:absolute;inset:-9px;border-radius:50%;
  border:2px solid var(--red);opacity:.55;animation:ping 1.9s ease-out infinite;
}
@keyframes ping{0%{transform:scale(.75);opacity:.7}100%{transform:scale(1.5);opacity:0}}

/* the beat caption */
.caption{
  position:absolute;inset-block-end:clamp(22px,5vh,54px);inset-inline-start:50%;
  transform:translateX(50%);width:min(680px,88vw);z-index:5;
  background:rgba(14,12,12,.86);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:16px;padding:20px 24px;
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
body[dir=ltr] .caption{transform:translateX(-50%)}
.caption .n{display:inline-flex;align-items:center;justify-content:center;
  width:27px;height:27px;border-radius:50%;background:var(--red);color:#fff;
  font-weight:900;font-size:13.5px;margin-inline-end:10px;vertical-align:2px}
.caption h4{display:inline;font-size:clamp(18px,2.4vw,23px);font-weight:800}
.caption p{color:var(--dim);font-size:clamp(15px,1.9vw,17px);margin-top:9px;line-height:1.6}

/* chapter opener + closer */
.opener{min-height:100svh;display:grid;place-items:center;padding:110px 20px 70px;position:relative}
.opener .in{width:min(860px,92vw)}
.opener .idx{color:var(--red-2);font-weight:900;letter-spacing:.24em;font-size:13px}
.opener h2{font-size:clamp(34px,6.4vw,68px);font-weight:900;line-height:1.06;margin-top:12px;
  letter-spacing:-.02em}
.juice{
  margin-top:26px;border-inline-start:4px solid var(--red);padding-inline-start:20px;
}
.juice b{display:block;font-size:clamp(24px,4.4vw,42px);font-weight:900;color:var(--paper);
  line-height:1.15}
.juice span{display:block;color:var(--dim);font-size:clamp(16px,2.2vw,19px);margin-top:8px}
.opener .lede{color:var(--dim);font-size:clamp(16px,2.1vw,19px);margin-top:26px;max-width:52ch}

.doc{padding:clamp(60px,10vh,120px) 0}
.doc .in{width:min(820px,92vw);margin-inline:auto}
.doc h3{font-size:13px;font-weight:900;letter-spacing:.2em;color:var(--gold);
  text-transform:uppercase;margin-bottom:18px}
.doc h4{font-size:clamp(21px,3vw,27px);font-weight:800;margin:26px 0 8px}
.doc p{color:#CFC4BF;margin:9px 0;font-size:clamp(16px,2vw,18px)}
.doc ul{margin:12px 0;padding-inline-start:22px;color:#CFC4BF}
.doc li{margin:7px 0}
.doc .kv{display:grid;gap:10px;margin-top:20px}
.doc .kv div{display:flex;gap:14px;align-items:baseline;border-block-end:1px solid var(--line);
  padding-block-end:10px}
.doc .kv b{flex:none;min-width:min(150px,34vw);color:var(--paper);font-weight:800;font-size:15.5px}
.doc .kv span{color:var(--dim);font-size:16px}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 13px;
  font-size:13.5px;font-weight:800;background:rgba(111,211,162,.13);color:var(--ok)}
.pill.you{background:rgba(232,182,92,.14);color:#E8B65C}

footer{border-block-start:1px solid var(--line);padding:60px 20px 70px;text-align:center;color:var(--dim);font-size:15px}
footer b{color:var(--paper)}

@media (prefers-reduced-motion:reduce){
  .mk::after{animation:none}
  .scrollhint i{animation:none}
  html{scroll-behavior:auto}
}
@media(max-width:760px){
  .shotbox{width:94vw}
  .caption{inset-block-end:16px;padding:15px 17px}
  .rail{display:none}
}
</style>
</head>

/* ══════════ build ══════════ */
const film = document.getElementById("film");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tt = o => (o && (o[L] ?? o.ar)) || "";

function stageHTML(ch, shot, ar, beats, key){
  return `
  <div class="track" data-beats="${key}" data-ch="${ch.id}" style="height:${(beats.length)*95}svh">
    <div class="stage">
      <div class="frame">
        <div class="shotbox" style="--ar:${ar}">
          <img src="${shot}" alt="">
          ${(key==="a" && ch.redact ? ch.redact : []).map(r=>
            `<span class="redact" style="left:${r.x}%;top:${r.y}%;width:${r.w}%;height:${r.h}%">
               <span>${L==="ar"?"بيانات عميل":"client data"}</span></span>`).join("")}
          ${beats.map((b,i)=> b.mx==null?"":
            `<span class="mk" data-i="${i}" style="left:${b.mx}%;top:${b.my}%">${i+1}</span>`).join("")}
        </div>
        <div class="caption">
          <span class="n">1</span><h4></h4>
          <p></p>
        </div>
      </div>
    </div>
  </div>`;
}

function chapterHTML(ch, idx){
  const badge = ch.status==="you"
    ? `<span class="pill you">ينتظر قرارك</span>` : `<span class="pill">جاهز الآن</span>`;
  let html = `<section class="chapter" id="ch-${ch.id}">
    <div class="opener"><div class="in">
      <div class="idx">${String(idx+1).padStart(2,"0")} — <span data-ch-name>${esc(ch[L]||ch.ar)}</span></div>
      <h2 data-ch-h>${esc(tt(ch.h))}</h2>
      <div class="juice"><b data-ch-j>${esc(tt(ch.juice))}</b><span data-ch-js>${esc(tt(ch.juiceSub))}</span></div>
      <p class="lede" data-ch-l>${esc(tt(ch.lede))}</p>
      <p style="margin-top:22px">${badge}</p>
    </div></div>`;
  html += stageHTML(ch, ch.shot, ch.ar_, ch.beats, "a");
  if(ch.shot2) html += stageHTML(ch, ch.shot2, ch.ar2, ch.beats2, "b");
  html += `<div class="doc"><div class="in">
      <h3 data-doc-t>${esc(tt(T.docTitle))}</h3>
      <div data-doc-body>${(ch.doc[L]||ch.doc.ar).map(([h,p])=>
        `<h4>${esc(h)}</h4><p>${esc(p)}</p>`).join("")}</div>
    </div></div></section>`;
  return html;
}

function render(){
  document.body.dir = L==="ar" ? "rtl" : "ltr";
  document.documentElement.lang = L;
  document.getElementById("lang").textContent = L==="ar" ? "English" : "العربية";
  document.querySelectorAll("[data-t]").forEach(n=>n.innerHTML = T[n.dataset.t][L]);
  document.getElementById("stats").innerHTML = STATS.map(s=>
    `<div><b>${L==="ar"?s.n:s.e}</b><span>${L==="ar"?s.ar:s.en}</span></div>`).join("");
  film.innerHTML = CH.map(chapterHTML).join("");
  document.getElementById("rail").innerHTML = CH.map((c,i)=>`<b data-go="ch-${c.id}" title="${esc(c[L]||c.ar)}"></b>`).join("");
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>
    document.getElementById(b.dataset.go).scrollIntoView({behavior:"smooth"}));
  bind();
}

/* ══════════ the camera ══════════ */
const lerp=(a,b,t)=>a+(b-a)*t;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let tracks=[];

function bind(){
  tracks = [...document.querySelectorAll(".track")].map(el=>{
    const ch = CH.find(c=>c.id===el.dataset.ch);
    const beats = el.dataset.beats==="b" ? ch.beats2 : ch.beats;
    return {el, ch, beats,
      box: el.querySelector(".shotbox"),
      cap: el.querySelector(".caption"),
      capN: el.querySelector(".caption .n"),
      capH: el.querySelector(".caption h4"),
      capP: el.querySelector(".caption p"),
      marks: [...el.querySelectorAll(".mk")],
      last:-1};
  });
  tick();
}

function tick(){
  const vh = window.innerHeight;
  for(const t of tracks){
    const r = t.el.getBoundingClientRect();
    if(r.bottom < -vh || r.top > vh*1.5) continue;
    const span = Math.max(1, r.height - vh);
    let p = Math.min(1, Math.max(0, -r.top / span));
    const n = t.beats.length - 1;
    const seg = p * n;
    let i = Math.min(n-1, Math.floor(seg));
    if(n === 0){ i = 0; }
    const f = n === 0 ? 0 : easeIO(Math.min(1, seg - i));
    const A = t.beats[i], B = t.beats[Math.min(n, i+1)] || A;
    const s  = lerp(A.s,  B.s,  f);
    const ox = lerp(A.ox, B.ox, f);
    const oy = lerp(A.oy, B.oy, f);
    t.box.style.transformOrigin = ox+"% "+oy+"%";
    t.box.style.transform = "scale("+s.toFixed(4)+")";
    t.box.style.setProperty("--inv", (1/s).toFixed(4));
    const active = f > .55 ? Math.min(n, i+1) : i;
    if(active !== t.last){
      t.last = active;
      const b = t.beats[active];
      t.capN.textContent = active+1;
      t.capH.textContent = tt(b.t);
      t.capP.textContent = tt(b.d);
      t.marks.forEach(m=>m.classList.toggle("on", +m.dataset.i === active));
    }
  }
  // rail
  const mid = window.scrollY + vh/2;
  CH.forEach((c,i)=>{
    const el = document.getElementById("ch-"+c.id); if(!el) return;
    const top = el.offsetTop, bot = top + el.offsetHeight;
    const dot = document.querySelectorAll("#rail b")[i];
    if(dot) dot.classList.toggle("on", mid>=top && mid<bot);
  });
  raf = 0;
}
let raf = 0;
const onScroll = () => { if(!raf) raf = requestAnimationFrame(tick); };
addEventListener("scroll", onScroll, {passive:true});
addEventListener("resize", onScroll, {passive:true});

document.getElementById("lang").onclick = () => {
  L = L==="ar" ? "en" : "ar"; localStorage.setItem("mwLang", L);
  const y = window.scrollY; render(); window.scrollTo(0,y);
};
render();

/* ?y=<px> jumps straight to a scroll offset — used for render checks and deep links. */
(function(){
  const q = new URLSearchParams(location.search).get("y");
  if(q !== null){
    const target = +q;
    const go = () => { window.scrollTo(0, target); onScroll(); };
    go();
    let n = 0;
    const id = setInterval(() => { go(); if(++n > 25 || Math.abs(scrollY-target) < 2) clearInterval(id); }, 80);
    addEventListener("load", go);
  }
})();
</script>
